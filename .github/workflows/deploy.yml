name: production déploiement API_EBAC

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ebac
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, gd
          coverage: none

      - name: Mettre Composer en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Exécuter les tests
        run: php artisan test

  deploy:
    name: Déployer sur cPanel par FTP
    runs-on: ubuntu-latest
    needs: tests
    environment: production
    timeout-minutes: 30

    steps:
      - name: Récupérer le code validé
        uses: actions/checkout@v4

      - name: Installer PHP pour la version de production
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, gd
          coverage: none

      - name: Installer les dépendances de production
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Générer la documentation Swagger
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan l5-swagger:generate

      - name: Vérifier la configuration FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          test -n "$FTP_HOST" || { echo "Le secret FTP_HOST est absent."; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Le secret FTP_USERNAME est absent."; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Le secret FTP_PASSWORD est absent."; exit 1; }
          test -n "$FTP_REMOTE_PATH" || { echo "Le secret FTP_REMOTE_PATH est absent."; exit 1; }

      - name: Installer le client FTP parallèle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer les fichiers vers cPanel
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<LFTP_COMMANDS
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --only-newer --parallel=8 --verbose=1 \
            --exclude-glob .git* \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob node_modules/** \
            --exclude-glob tests/** \
            --exclude-glob storage/app/** \
            --exclude-glob storage/debugbar/** \
            --exclude-glob storage/framework/** \
            --exclude-glob storage/logs/** \
            --exclude-glob docs/** \
            --exclude-glob scripts/** \
            --exclude-glob public.zip \
            --exclude-glob '~$*' \
            ./ "$FTP_REMOTE_PATH"
          bye
          LFTP_COMMANDS
